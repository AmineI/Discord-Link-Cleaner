name: Build and push Docker image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '*requirements.txt'
      - 'main.py'
      - '.github/workflows/docker-publish.yml'
#  pull_request:
#    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      dated-tag:
        description: Add a UTC-dated variant of the ref tag
        required: false
        type: boolean
        default: false

jobs:
  prune_untagged_images:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Delete old untagged versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 12
          delete-only-untagged-versions: 'true'

  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Publish from the default branch, tags, or manually triggered runs.
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Define the image name and tags based on the repository and version.
      - name: Tags for this architecture
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=${{ github.ref_name }}_{{date 'YYYYMMDD' tz='UTC'}},enable=${{ inputs.dated-tag == true }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Keep the push condition aligned with the registry login.
          push: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}